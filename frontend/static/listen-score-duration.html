<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YourMusicTutorial - Duration Score Lab</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #111318;
            color: white;
        }

        .container {
            width: min(1120px, 95%);
            margin: 0 auto;
            padding: 44px 0;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 36px;
        }

        .subtitle {
            color: #9da6b5;
            margin-bottom: 28px;
        }

        .card {
            background: #1b1e25;
            border: 1px solid #30343d;
            border-radius: 16px;
            padding: 26px;
            margin-bottom: 22px;
        }

        .phrase-grid {
            display: grid;
            gap: 10px;
        }

        .phrase-row {
            display: grid;
            grid-template-columns: 42px 85px 110px minmax(190px, 1fr);
            gap: 12px;
            align-items: center;
            padding: 12px;
            background: #15181e;
            border-radius: 10px;
        }

        .num {
            color: #8590a3;
            font-weight: bold;
        }

        .note {
            font-size: 20px;
            font-weight: bold;
        }

        .expected {
            color: #aab2c0;
            font-family: monospace;
        }

        .duration-control {
            display: grid;
            grid-template-columns: 1fr 82px;
            gap: 8px;
            align-items: center;
        }

        input[type="range"] {
            width: 100%;
        }

        input[type="number"],
        button {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #444b57;
            background: #20242b;
            color: white;
            font-size: 15px;
        }

        button {
            margin-top: 18px;
            background: #4f7cff;
            border-color: #4f7cff;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #638cff;
        }

        .summary {
            display: none;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        .summary-box {
            background: #15181e;
            border-radius: 12px;
            padding: 18px;
        }

        .summary-label {
            color: #8f98a8;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .summary-value {
            font-size: 34px;
            font-weight: 800;
        }

        .good { color: #73df9a; }
        .warn { color: #ffd36d; }
        .bad  { color: #ff7f87; }

        .coaching {
            margin-top: 18px;
            padding: 16px;
            border-radius: 10px;
            background: #15181e;
            line-height: 1.6;
        }

        .results-wrap {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            min-width: 860px;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 10px;
            border-bottom: 1px solid #30343d;
            text-align: left;
        }

        th {
            color: #99a3b4;
            font-size: 13px;
        }

        .note-pill {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 7px;
            background: #20242b;
            font-family: monospace;
            font-weight: bold;
        }

        .status {
            margin-top: 14px;
            min-height: 20px;
            color: #9da6b5;
        }

        @media (max-width: 760px) {
            .phrase-row {
                grid-template-columns: 36px 70px 90px 1fr;
            }

            .summary-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 520px) {
            .summary-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎷 Duration / Hold Score Lab</h1>
    <div class="subtitle">
        Simulate how long each note is held compared with the tutorial.
    </div>

    <div class="card">
        <h2>Test phrase</h2>
        <div class="phrase-grid" id="phrase-grid"></div>

        <button id="score-duration">
            Score Duration
        </button>

        <div class="status">
            Adjust how long each note was held, then score the phrase.
        </div>
    </div>

    <div class="card summary" id="summary">
        <h2>Duration result</h2>

        <div class="summary-grid">
            <div class="summary-box">
                <div class="summary-label">Duration score</div>
                <div class="summary-value" id="duration-score">--</div>
            </div>

            <div class="summary-box">
                <div class="summary-label">Good holds</div>
                <div class="summary-value" id="good-count">--</div>
            </div>

            <div class="summary-box">
                <div class="summary-label">Average error</div>
                <div class="summary-value" id="average-error">--</div>
            </div>

            <div class="summary-box">
                <div class="summary-label">Bias</div>
                <div class="summary-value" id="duration-bias">--</div>
            </div>
        </div>

        <div class="coaching" id="coaching"></div>

        <div class="results-wrap">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Note</th>
                        <th>Expected</th>
                        <th>Held</th>
                        <th>Error</th>
                        <th>Result</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody id="results-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="/static/js/listen_score_duration.js?v=1"></script>
</body>
</html>
